name: Deploy to Raspberry Pi

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        default: "latest"

jobs:
  deploy:
    name: Deploy to Raspberry Pi
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
    environment: raspberry4

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}

    steps:
      - name: Extract image tag
        id: image_tag
        run: |
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Deploying image tag: ${IMAGE_TAG}"

      - name: Detect platform architecture
        id: arch
        run: |
          ARCH=$(uname -m)
          echo "Detected architecture: $ARCH"

          if [ "$ARCH" = "aarch64" ]; then
            PLATFORM="linux/arm64"
          elif [ "$ARCH" = "armv7l" ] || [ "$ARCH" = "armv6l" ]; then
            PLATFORM="linux/arm/v7"
          elif [ "$ARCH" = "x86_64" ]; then
            PLATFORM="linux/amd64"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi

          echo "platform=${PLATFORM}" >> $GITHUB_OUTPUT
          echo "Using Docker platform: ${PLATFORM}"

      - name: Clean workspace
        run: |
          find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 ! -name ".git" ! -name "storage" -exec rm -rf {} +

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Free up memory before pull
        run: |
          echo "Freeing up memory..."
          docker container prune -f --filter "label=maintainer=olx-watcher" || true
          docker image prune -f || true
          sync
          echo "Memory status:"
          free -h
          df -h

      - name: Pull image with platform specification
        run: |
          PLATFORM="${{ steps.arch.outputs.platform }}"
          IMAGE="${DOCKER_USERNAME}/olx-watcher-bot:${IMAGE_TAG}"

          echo "Pulling image: ${IMAGE}"
          echo "Platform: ${PLATFORM}"

          for i in {1..3}; do
            echo "Pull attempt $i of 3..."
            if docker pull --platform "${PLATFORM}" "${IMAGE}"; then
              echo "Image pulled successfully!"
              exit 0
            fi
            echo "Pull failed, retrying..."
            docker system prune -af || true
            sync
            sleep 10
          done

          echo "Failed to pull image after 3 attempts"
          exit 1

      - name: Stop and remove old container
        run: |
          docker compose -f compose.raspberry.yml down --remove-orphans || true
          docker ps -aq --filter "label=maintainer=olx-watcher" | xargs -r docker rm -f || true
          echo "Cleanup completed"

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          APP_NAME="${{ vars.APP_NAME }}"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=${{ vars.APP_DEBUG }}
          APP_URL=${{ vars.APP_URL }}
          APP_PORT=${{ vars.APP_PORT }}

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en

          LOG_CHANNEL=stack
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'debug' }}
          LOG_STACK=stdout,daily

          DB_CONNECTION=pgsql
          DB_HOST=${{ vars.DB_HOST }}
          DB_PORT=5432
          DB_DATABASE=${{ vars.DB_DATABASE }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120

          CACHE_STORE=database
          QUEUE_CONNECTION=database

          MAIL_MAILER=${{ vars.MAIL_MAILER }}
          MAIL_HOST=${{ vars.MAIL_HOST }}
          MAIL_PORT=${{ vars.MAIL_PORT }}
          MAIL_USERNAME=${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="${{ vars.APP_NAME }}"

          WWWUSER=1000
          WWWGROUP=1000

          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}

          AUTORIA_API_KEY=${{ secrets.AUTORIA_API_KEY }}

          EOF

      - name: Resolve Telegram bot username
        run: |
          USERNAME="${{ vars.TELEGRAM_BOT_USERNAME }}"
          if [ -z "${USERNAME}" ]; then
            USERNAME=$(curl -sf "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe" | jq -r '.result.username // empty')
          fi
          if [ -n "${USERNAME}" ]; then
            sed -i "s/^TELEGRAM_BOT_USERNAME=.*/TELEGRAM_BOT_USERNAME=${USERNAME}/" .env
            echo "Using bot username: ${USERNAME}"
          else
            echo "TELEGRAM_BOT_USERNAME not set; /command@bot parsing in groups may fail"
          fi

      - name: Link storage onto the host
        run: |
          mkdir -p storage/logs storage/app/public storage/app/private

          migrate_named_volume() {
            local volume="$1"
            local dest="$2"

            if ! docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "No named volume $volume to migrate"
              return 0
            fi

            if [ -n "$(find "$dest" -type f ! -name '.gitignore' -print -quit 2>/dev/null)" ]; then
              echo "Keeping existing host files in $dest"
              return 0
            fi

            echo "Copying $volume -> $dest"
            docker run --rm --entrypoint cp \
              -v "${volume}:/from:ro" \
              -v "$(pwd)/${dest}:/to" \
              "${DOCKER_USERNAME}/olx-watcher-bot:${IMAGE_TAG}" \
              -a /from/. /to/
          }

          PROJECT="$(basename "$(pwd)")"
          volume_name() {
            local suffix="$1"
            local exact="${PROJECT}_${suffix}"
            if docker volume inspect "$exact" >/dev/null 2>&1; then
              echo "$exact"
              return
            fi
            docker volume ls -q | grep "_${suffix}$" | head -1
          }

          logs_volume="$(volume_name storage_logs)"
          app_volume="$(volume_name storage_app)"
          migrate_named_volume "${logs_volume:-${PROJECT}_storage_logs}" "storage/logs"
          migrate_named_volume "${app_volume:-${PROJECT}_storage_app}" "storage/app"

          echo "Host logs directory:"
          ls -la storage/logs

      - name: Deploy with Docker Compose
        run: |
          echo "Using image: ${DOCKER_USERNAME}/olx-watcher-bot:${IMAGE_TAG}"
          docker compose -f compose.raspberry.yml up -d --no-deps
          echo "Container started"

      - name: Wait for container readiness
        run: |
          echo "Waiting for app container to be ready..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Status}}' olx-watcher-bot 2>/dev/null || echo "missing")
            if [ "$STATUS" = "running" ] && docker exec olx-watcher-bot /usr/local/bin/php -r "echo 1;" >/dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting ($i/30)... container status: $STATUS"
            sleep 2
          done
          echo "=== App failed to start. Diagnostics: ==="
          docker ps -a --filter "name=olx-watcher-bot"
          docker inspect olx-watcher-bot --format='Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}, Error: {{.State.Error}}' 2>/dev/null || true
          docker logs olx-watcher-bot --tail=50 2>&1 || true
          exit 1

      - name: Check environment and test connection
        run: |
          docker exec olx-watcher-bot php artisan config:clear
          echo "=== Environment Check ==="
          docker exec olx-watcher-bot printenv | grep -E "^DB_|^APP_" || echo "Failed to read environment"
          docker exec olx-watcher-bot php artisan env || echo "artisan env not available"
          echo "=== Testing Database Connection ==="
          docker exec olx-watcher-bot php artisan tinker --execute="try { DB::connection()->getPdo(); echo 'Database connected successfully!' . PHP_EOL; } catch (Exception \$e) { echo 'Connection failed: ' . \$e->getMessage() . PHP_EOL; echo 'Trace: ' . \$e->getTraceAsString() . PHP_EOL; throw \$e; }"
          echo "=== Checking worker logs ==="
          docker exec olx-watcher-bot cat /var/www/html/storage/logs/worker.log | tail -50 || echo "No worker logs yet"
          echo "=== Checking Laravel application logs ==="
          docker exec olx-watcher-bot cat /var/www/html/storage/logs/laravel.log | tail -50 || echo "No Laravel logs yet"

      - name: Run database migrations
        run: |
          docker exec olx-watcher-bot php artisan migrate --force || {
            echo "=== Migration failed, checking logs ==="
            docker compose -f compose.raspberry.yml logs --tail=50 app
            exit 1
          }
          echo "Migrations completed"

      - name: Optimize application
        run: |
          docker exec olx-watcher-bot php artisan cache:clear
          docker exec olx-watcher-bot php artisan config:cache
          docker exec olx-watcher-bot php artisan route:cache
          docker exec olx-watcher-bot php artisan view:cache
          docker exec olx-watcher-bot php artisan optimize

      - name: Register Telegram bot commands
        run: docker exec olx-watcher-bot php artisan nutgram:register-commands

      - name: Restart daemons
        run: |
          docker exec olx-watcher-bot supervisorctl restart nutgram queue

      - name: Cleanup old images
        run: |
          docker image prune -af --filter "until=168h" || true
          docker system df

      - name: Deployment Status
        run: |
          echo "✅ Successfully deployed ${IMAGE_TAG} to Raspberry Pi"
          echo "Host logs (persist when Docker is stopped): $(pwd)/storage/logs"
          ls -la storage/logs || true
          docker compose -f compose.raspberry.yml ps
