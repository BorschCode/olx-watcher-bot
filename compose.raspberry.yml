services:
  app:
    image: ${DOCKER_USERNAME}/olx-watcher-bot:${IMAGE_TAG:-latest}
    container_name: olx-watcher-bot
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/app:/var/www/html/storage/app
    restart: unless-stopped
